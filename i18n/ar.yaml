home:
  hero_title: مجموعة منتقاة من إدخالات terminfo عالية الجودة.
  hero_lead: هل تفتقد بعض الإمكانيات، أو ألوان معطلة، أو سلوك غريب للمفاتيح؟ ابحث عن ملف مصدر terminfo الصحيح لطرفيتك وقم بتثبيته في ثوانٍ بأمر واحد.
  install_label: تثبيت بسطر واحد
  install_meta: يكتشف البرنامج النصي متغير <code>$TERM</code> الخاص بك، ويُنزّل الإدخال المطابق، ويُصرّفه باستخدام <code>tic</code>.
  copy: نسخ
  learn_more: اعرف المزيد ←
  sha256_label: SHA-256
  browse_button: تصفح جميع الإدخالات
  contribute_button: ساهم بإدخال

  problem_title: المشكلة

  quickstart_title: البداية السريعة
  quickstart_1_title: "1. اعثر على طرفيتك"
  quickstart_1_text: ابحث في فهرس التصفح عن محاكي الطرفية الخاص بك (مثل Alacritty، Kitty، WezTerm).
  quickstart_2_title: "2. انسخ أمر السطر الواحد"
  quickstart_2_text: الصق أمر التثبيت. يكتشف تلقائياً متغير $TERM الخاص بك ويتولى الباقي.
  quickstart_3_title: "3. تم"
  quickstart_3_text: يُنزّل البرنامج النصي ملف المصدر .ti، ويشغّل tic -x، ويثبّته بأمان في ~/.terminfo.

