  problem_title: مشکل

  quickstart_title: شروع سریع
  quickstart_1_title: "۱. ترمینال خود را پیدا کنید"
  quickstart_1_text: در فهرست قابل مرور، شبیه‌ساز خود را جستجو کنید (مثلاً Alacritty، Kitty، WezTerm).
  quickstart_2_title: "۲. فرمان یک‌خطی را کپی کنید"
  quickstart_2_text: فرمان نصب را بچسبانید. به طور خودکار $TERM شما را تشخیص می‌دهد و بقیه را انجام می‌دهد.
  quickstart_3_title: "۳. انجام شد"
  quickstart_3_text: اسکریپت فایل منبع .ti را دانلود می‌کند، tic -x را اجرا می‌کند و به طور ایمن در ~/.terminfo نصب می‌کند.

