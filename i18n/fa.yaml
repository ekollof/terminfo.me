home:
  hero_title: مجموعه‌ای منتخب از ورودی‌های terminfo با کیفیت بالا.
  hero_lead: قابلیت‌های گمشده، رنگ‌های خراب یا رفتار عجیب کلیدها؟ منبع terminfo مناسب برای ترمینال خود را پیدا کنید و در چند ثانیه با یک فرمان نصب کنید.
  install_label: نصب با یک خط
  install_meta: اسکریپت متغیر <code>$TERM</code> شما را تشخیص می‌دهد، ورودی مربوطه را دانلود می‌کند و آن را با <code>tic</code> کامپایل می‌کند.
  copy: کپی
