<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
  <!-- Dark terminal-inspired background with subtle rounding -->
  <rect width="32" height="32" rx="5" fill="#0b0f14"/>
  <!-- Accent green prompt glyph (monospace-style $) -->
  <text x="5.5" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700" fill="#4cc38a">$</text>
  <!-- Tiny cursor hint -->
  <rect x="19" y="17" width="2" height="9" fill="#4cc38a" opacity="0.85"/>
</svg>
