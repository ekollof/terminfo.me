<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default `en-us` }}" dir="ltr">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header">
      {{ partial "header.html" . }}
    </header>
    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      {{ partial "footer.html" . }}
    </footer>
  </div>
  <script src="{{ `js/main.js` | relURL }}"></script>
</body>
</html>
