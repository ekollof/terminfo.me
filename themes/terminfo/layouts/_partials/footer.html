<div class="footer-inner">

    &copy; {{ now.Year }} <a href="{{ site.Params.repo }}">{{ i18n "site.title" }}</a>. {{ i18n "footer.license" | default "Licensed under MIT." }}

  <p class="footer-meta">
    {{ i18n "footer.built_with" | default "Built with" }} <a href="https://gohugo.io/" target="_blank" rel="noopener">Hugo</a> &middot;
    <a href="{{ site.Params.repo }}/blob/main/LICENSE" target="_blank" rel="noopener">{{ i18n "footer.license" | default "License" }}</a> &middot;
    <a href="https://ko-fi.com/andrath" target="_blank" rel="noopener">{{ i18n "nav.kofi" | default "Ko-fi" }}</a>

</div>
